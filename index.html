<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23050505%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%23ff5c30%27/%3E%3C/svg%3E" />
  <meta name="description" content="Tornado Shawarma — animated digital menu" />
  <!-- Installable web app: when added to the home screen / installed, it opens fullscreen automatically -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tornado Menu" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <title>تورنيدو شاورما — قائمة الطعام</title>

  <link rel="preload" as="image" href="assets/page1_full.png" />
  <link rel="preload" as="image" href="assets/page2_full.png" />
  <link rel="preload" as="image" href="assets/page3_full.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Ambient background: sits BEHIND the menu artwork, never over it -->
  <div class="bg" aria-hidden="true">
    <div class="bg__ambient"></div>
    <canvas class="bg__dust"></canvas>
    <div class="bg__vignette"></div>
  </div>

  <!-- Menu viewer -->
  <main class="viewer" id="viewer" aria-label="Tornado Shawarma menu">
    <!-- .stage keeps the exact aspect ratio of the artwork; pages are injected here by JS -->
    <div class="stage" id="stage"></div>
  </main>

  <!-- Minimal controls -->
  <nav class="dots" id="dots" dir="ltr" aria-label="Menu pages"></nav>

  <!-- Fullscreen hint: browsers only allow fullscreen after a user gesture, so the first tap/click/key
       anywhere enters fullscreen. Hidden automatically once fullscreen (or if unsupported). -->
  <button class="fs-hint" id="fsHint" type="button" hidden>
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
    <span>اضغط لملء الشاشة</span>
  </button>

  <!-- Loader (shown until every PNG is decoded) -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__bar"><span id="loaderFill"></span></div>
  </div>

  <!-- GSAP (vendored so the page also works offline / from file://) -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>

  <!-- App -->
  <script src="js/manifest-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/background.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
